name: Feature request
description: 提议新的 Finder 动作、设置或可靠性改进
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述真实使用场景，而不只是实现方式。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明入口、适用文件类型、成功结果和用户提示。
    validations:
      required: true

  - type: textarea
    id: failure
    attributes:
      label: 失败、冲突与恢复策略
      description: 文件已存在、权限不足、处理中断或部分成功时应该怎样处理？
    validations:
      required: true

  - type: textarea
    id: permissions
    attributes:
      label: 权限与隐私影响
      description: 是否需要新增 entitlement、网络、外部应用、日志字段或长期授权？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和 Roadmap。
          required: true
        - label: 方案不会静默覆盖或永久删除用户文件。
          required: true

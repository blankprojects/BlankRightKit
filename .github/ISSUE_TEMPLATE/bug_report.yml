name: Bug report
description: 报告可复现的 BlankRightKit 功能异常
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。日志和截图必须先删除用户名、私人路径、文件名和文件内容。安全漏洞请不要使用此表单。

  - type: input
    id: version
    attributes:
      label: BlankRightKit 版本
      description: 例如 0.1.0 (8)，可在 App 或 Info.plist 中查看。
      placeholder: 0.1.0 (8)
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS 与 Mac
      placeholder: macOS 15.6，Apple Silicon
    validations:
      required: true

  - type: input
    id: xcode
    attributes:
      label: Xcode 版本和签名方式
      placeholder: Xcode 16.x，Personal Team / Developer ID / 仅源码测试
    validations:
      required: true

  - type: dropdown
    id: context
    attributes:
      label: 出现问题的位置
      options:
        - Finder 空白处右键
        - Finder 文件/文件夹右键
        - Finder 工具栏
        - BlankRightKit 设置 App
        - 构建、签名或扩展注册
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 右键……
        3. 点击……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: trace
    attributes:
      label: 已脱敏的 BRKTRACE
      description: 只附与该次操作相关的几行，并把私人路径替换为 `<PATH>`。
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有发现重复报告。
          required: true
        - label: 我确认这不是需要私下报告的安全漏洞。
          required: true
        - label: 我已从日志和截图中移除私人数据。
          required: true

name: BlankRightKit

options:
  minimumXcodeGenVersion: 2.43.0
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  BlankRightKit:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - BlankRightKit.entitlements
      - path: Shared/Sources/BlankRightKitCore
    resources:
      - path: Resources
    info:
      path: App/Info.plist
    entitlements:
      path: App/BlankRightKit.entitlements
      properties:
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/BlankRightKit/
    dependencies:
      - target: BlankRightKitFinder
        embed: true
        codeSign: true
      - sdk: FinderSync.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.blankrightkit.BlankRightKit
        PRODUCT_NAME: BlankRightKit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO

  BlankRightKitFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderExtension
        excludes:
          - Info.plist
          - BlankRightKitFinder.entitlements
      - path: Shared/Sources/BlankRightKitCore
      - path: Shared/Sources/BlankRightKitActions
    info:
      path: FinderExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionAttributes: {}
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    entitlements:
      path: FinderExtension/BlankRightKitFinder.entitlements
      properties:
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/BlankRightKit/
    dependencies:
      - sdk: AppKit.framework
      - sdk: CryptoKit.framework
      - sdk: FinderSync.framework
      - sdk: ImageIO.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.blankrightkit.BlankRightKit.FinderExtension
        PRODUCT_MODULE_NAME: BlankRightKitFinder
        PRODUCT_NAME: BlankRightKitFinder
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

schemes:
  BlankRightKit:
    build:
      targets:
        BlankRightKit: all
        BlankRightKitFinder: all
    run:
      config: Debug
    archive:
      config: Release

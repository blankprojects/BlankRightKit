name: RightKit

options:
  minimumXcodeGenVersion: 2.43.0
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  RightKit:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - RightKit.entitlements
      - path: Shared/Sources/RightKitCore
    resources:
      - path: Resources
    info:
      path: App/Info.plist
    entitlements:
      path: App/RightKit.entitlements
    dependencies:
      - target: RightKitFinder
        embed: true
        codeSign: true
      - sdk: FinderSync.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rightkit.RightKit
        PRODUCT_NAME: RightKit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO

  RightKitFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderExtension
        excludes:
          - Info.plist
          - RightKitFinder.entitlements
      - path: Shared/Sources/RightKitCore
      - path: Shared/Sources/RightKitActions
    info:
      path: FinderExtension/Info.plist
    entitlements:
      path: FinderExtension/RightKitFinder.entitlements
    dependencies:
      - sdk: AppKit.framework
      - sdk: CryptoKit.framework
      - sdk: FinderSync.framework
      - sdk: ImageIO.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rightkit.RightKit.FinderExtension
        PRODUCT_MODULE_NAME: RightKitFinder
        PRODUCT_NAME: RightKitFinder
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

schemes:
  RightKit:
    build:
      targets:
        RightKit: all
        RightKitFinder: all
    run:
      config: Debug
    archive:
      config: Release
